# ============================================================
# MoneyVeda Daily Signal Pipeline — GitHub Actions
# ============================================================
# The signal chain runs in strict order; each stage feeds the next.
# The previous version ran only stages 1 and 3, which is why the
# Signals tab was empty:
#
#   1. filing_scraper     NSE announcements  → filings
#   2. sentiment_analyzer FinBERT            → filings.sentiment   ← was missing
#   3. signal_engine      scored filings     → signals
#   4. publishing_gate    appends "| PUBLISHED"                    ← was missing
#
# Stage 4 is not optional. /api/signals filters on
# `message LIKE '%PUBLISHED%'`, and only publishing_gate.py writes
# that suffix. Skip it and the endpoint returns zero rows even when
# the signals table is full.
#
# Stage 2 is not optional either. signal_engine.py selects filings
# where sentiment IS NOT NULL, so without FinBERT it only ever sees
# rows analysed by some earlier manual run.
#
# ── temporal_checker.py is DELIBERATELY NOT RUN ──────────────
# It has two bugs that corrupt confidence scores on every run:
#
#   (a) No filter excluding signals it has already processed. It
#       re-reads the same rows daily and re-applies its multiplier,
#       so confidence decays 0.66 → 0.33 → 0.17 → 0.08 while the
#       message accumulates "| NO_PRICE_CORRELATION" repeatedly.
#
#   (b) It matches against signals where source = 'yfinance', but
#       nothing in the repo writes rows with that source. The list
#       is always empty, so EVERY signal takes the "no correlation"
#       branch and gets halved.
#
# Since it runs after the gate, "| PUBLISHED" survives and the API
# keeps working — but the confidence numbers feeding the accuracy
# dashboard become meaningless. Four correct stages beat five where
# one silently corrupts the output.
#
# To re-enable later it needs: a filter skipping messages that
# already contain PRICE_CORRELATED / NO_PRICE_CORRELATION /
# TIME_GAP, and something that actually writes source='yfinance'
# price-move rows for it to correlate against.
#
# Verify with:  select source, count(*) from signals group by source;
# ── ───────────────────────────────────────────────────────────
#
# TIMING
#   15:45 IST (10:15 UTC), Mon–Fri — after the 15:30 NSE close so
#   the day's filings are in. /api/signals filters on created_at >=
#   today in UTC, and 10:15 UTC is the same UTC day, so signals
#   written here stay visible for the rest of the session.
#
# NOTE: signals will not appear on the site until the Render web
# service is restored. This workflow fills the database; the Flask
# API serves it. Both are required.
#
# SECRETS REQUIRED
#   SUPABASE_URL, SUPABASE_SECRET_KEY
# ============================================================

name: MoneyVeda Daily Signal Generator

on:
  schedule:
    - cron: "15 10 * * 1-5"     # 15:45 IST, weekdays
  workflow_dispatch:
    inputs:
      skip_scraper:
        description: "Skip the NSE scrape (reprocess existing filings only)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # FinBERT inference on CPU is the long pole

    env:
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ProsusAI/finbert is ~440 MB. Without this cache every run
      # re-downloads it, which is slow and occasionally rate-limited
      # by the HF CDN.
      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install supabase python-dotenv yfinance requests beautifulsoup4 nse
          fi
          # CPU-only torch: ~200 MB instead of ~2 GB with CUDA.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers

      # ── Stage 1 ──────────────────────────────────────────────
      - name: "1 · Scrape NSE filings"
        if: ${{ github.event.inputs.skip_scraper != 'true' }}
        run: python filing_scraper.py

      # ── Stage 2 ──────────────────────────────────────────────
      # sentiment_analyzer.py processes 20 filings per invocation.
      # Loop so a heavy filing day drains fully; it exits early with
      # "No filings to analyze!" once the backlog is clear, so the
      # extra passes cost only model load time (cached).
      - name: "2 · FinBERT sentiment analysis"
        run: |
          for i in 1 2 3 4 5; do
            echo "── sentiment pass $i ──"
            python sentiment_analyzer.py 2>&1 | tee /tmp/sent.log
            if grep -q "No filings to analyze" /tmp/sent.log; then
              echo "Backlog clear after $i pass(es)."
              break
            fi
          done

      # ── Stage 3 ──────────────────────────────────────────────
      - name: "3 · Generate signals"
        run: python signal_engine.py

      # ── Stage 4 ──────────────────────────────────────────────
      # Without this, /api/signals returns nothing. Ever.
      - name: "4 · Publishing gate"
        run: python publishing_gate.py

      - name: Pipeline summary
        if: always()
        run: |
          echo "Signal pipeline finished — status: ${{ job.status }}"
          echo "Verify once Render is restored:"
          echo "  curl -s https://moneyveda.org/api/backend/api/signals | head -c 400"

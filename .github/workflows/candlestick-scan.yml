name: Candlestick Scan

on:
  schedule:
    # Odd minutes on purpose: GitHub drops scheduled runs under load, which
    # peaks at :00/:15/:30. Two fires per day — the second is a safety net.
    # A duplicate run costs nothing: the scanner skips writing when the data
    # is unchanged, and the commit step then finds no diff.
    #
    # 10:18 UTC = 15:48 IST — 18 min after the NSE close.
    - cron: "18 10 * * 1-5"
    # 12:52 UTC = 18:22 IST — backup, and the one that usually publishes.
    - cron: "52 12 * * 1-5"

  workflow_dispatch:        # manual run button, useful for first deploy
    inputs:
      universe:
        description: "Universe to scan"
        required: false
        default: "nifty500"
        type: choice
        options: [nifty50, nifty100, nifty200, nifty500]

permissions:
  contents: write

concurrency:
  group: candlestick-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # TA-Lib >=0.6.5 ships manylinux wheels with the C library bundled,
          # so no apt-get / autotools build step is needed.
          pip install "TA-Lib>=0.6.5" yfinance pandas numpy requests

      - name: Run scanner
        env:
          # Widen or narrow here. The symbol list itself comes from
          # data/universe/<name>.csv — NSE blocks datacenter IPs, so the
          # committed CSV is the primary source, not the live fetch.
          UNIVERSE: ${{ inputs.universe || 'nifty500' }}
          MIN_TURNOVER: "20000000"      # Rs 2 crore median daily turnover
        run: python scripts/scan_candlesticks.py

      - name: Commit results
        run: |
          git config user.name  "moneyveda-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candlestick/ data/universe/
          if git diff --staged --quiet; then
            echo "No change (market holiday or identical signals) — skipping commit."
            exit 0
          fi
          git commit -m "chore(scan): candlestick signals $(date -u +%Y-%m-%d)"
          # Other scheduled workflows (sitemap, commentary) also push to main.
          # Rebase and retry so a concurrent push doesn't silently fail the run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — rebasing and retrying ($attempt/5)."
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

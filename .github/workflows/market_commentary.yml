# ============================================================
# Schedule re-register: 2026-05-04 (consolidated cron)
# MoneyVeda Market Commentary v2.0 — GitHub Actions
# ============================================================
name: Market Commentary

on:
  schedule:
    # Fires every :00 and :30 from 02:00 UTC through 10:30 UTC, Mon–Fri.
    # IST: 07:30, 08:00, 08:30, 09:00, 09:30, 10:00, 10:30, 11:00, 11:30, 
    #      12:00, 12:30, 13:00, 13:30, 14:00, 14:30, 15:00, 15:30, 16:00
    - cron: "0,30 2-10 * * 1-5"
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      mode:
        description: "Commentary mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - pre
          - intraday
          - post
      slot:
        description: "Intraday slot HH:MM (only for mode=intraday). Leave blank to auto-detect."
        required: false
        default: ""
        type: string

# Prevent overlapping runs
concurrency:
  group: market-commentary
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate commentary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Determine execution arguments
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--mode ${{ github.event.inputs.mode }}"
            if [ -n "${{ github.event.inputs.slot }}" ]; then
              ARGS="$ARGS --slot ${{ github.event.inputs.slot }}"
            fi
          else
            # Scheduled runs use auto-detection
            ARGS="--mode auto"
          fi

          # Robust retry logic (up to 3 attempts for network/API flickers)
          for i in 1 2 3; do
            echo "Execution attempt $i..."
            python market_commentary.py $ARGS && exit 0
            echo "Attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          exit 1

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyVeda — API Control Panel</title>
    <style>
        body {
            background-color: #0A0A0F;
            color: #E2E8F0;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .admin-card {
            background: #12121A;
            border: 1px solid #1E1E2F;
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h2 { margin-top: 0; color: #38BDF8; font-size: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #94A3B8; }
        input {
            width: 100%;
            padding: 0.75rem;
            background: #1E1E2F;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #FFF;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1.25rem;
        }
        input:focus { border-color: #38BDF8; outline: none; }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #0284C7;
            border: none;
            border-radius: 6px;
            color: #FFF;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369A1; }
        .msg { font-size: 0.875rem; text-align: center; margin-top: 1rem; display: none; }
        .success { color: #4ADE80; }
        .error { color: #F87171; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Breeze API Session Guard</h2>
    <p style="font-size: 0.85rem; color: #64748B; margin-bottom: 1.5rem;">Update the global execution token before the 08:00 IST cron invocation window.</p>
    
    <label for="tokenInput">Today's 8-Digit Session Token</label>
    <input type="text" id="tokenInput" placeholder="e.g., 55791960" autocomplete="off">
    
    <button onclick="updateBreezeToken()">Sync to Supabase Cloud</button>
    <div id="statusMsg" class="msg"></div>
</div>

<script>
    // 1. Replace these configuration markers with your active Supabase endpoints
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL"; 
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_OR_SERVICE_KEY";

    async function updateBreezeToken() {
        const tokenValue = document.getElementById('tokenInput').value.trim();
        const statusMsg = document.getElementById('statusMsg');
        
        if (!tokenValue) {
            showStatus("Please provide a valid token string.", "error");
            return;
        }

        statusMsg.style.display = "block";
        statusMsg.className = "msg";
        statusMsg.innerText = "Transmitting payload...";

        // 2. Direct REST Upsert request to match your table layout schema
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/api_sessions?id=eq.icici_breeze`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({
                    session_token: tokenValue,
                    updated_at: new Date().toISOString()
                })
            });

            if (response.ok) {
                showStatus("✅ Handshake token synchronized successfully! Your Render cron engines are cleared for execution.", "success");
                document.getElementById('tokenInput').value = "";
            } else {
                const errData = await response.json();
                showStatus(`Sync error: ${errData.message || response.statusText}`, "error");
            }
        } catch (err) {
            showStatus(`Network deployment failure: ${err.message}`, "error");
        }
    }

    function showStatus(text, type) {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.style.display = "block";
        statusMsg.className = `msg ${type}`;
        statusMsg.innerText = text;
    }
</script>

</body>
</html>
